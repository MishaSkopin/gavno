<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Запрошення</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --accent-color: #ff2a5f;
            --accent-hover: #e01f50;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0b0e;
            color: #f3f3f6;
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.1);
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }

        .slide {
            display: none;
            position: relative;
            z-index: 2;
            animation: fadeIn 0.3s ease-in-out;
        }

        .slide.active {
            display: block;
        }

        /* Фонове фото для кожного слайда із затемненням (заміни photo1.jpg тощо на свої файли або посилання) */
        .slide::before {
            content: '';
            position: absolute;
            top: -24px;
            left: -24px;
            right: -24px;
            bottom: -24px;
            background-size: cover;
            background-position: center;
            filter: brightness(0.35) blur(1px);
            z-index: -1;
            border-radius: 24px;
        }

        #slide-1::before { background-image: url('photo1.jpg'); }
        #slide-2::before { background-image: url('photo2.jpg'); }
        #slide-3::before { background-image: url('photo3.jpg'); }
        #slide-4::before { background-image: url('photo4.jpg'); }
        #slide-5::before { background-image: url('photo5.jpg'); }
        #slide-6::before { background-image: url('photo6.jpg'); }
        #slide-7::before { background-image: url('photo7.jpg'); }
        #slide-8::before { background-image: url('photo8.jpg'); }
        #slide-9::before { background-image: url('photo9.jpg'); }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            line-height: 1.4;
            font-weight: 700;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        button.option-btn {
            background-color: rgba(22, 22, 28, 0.85);
            backdrop-filter: blur(10px);
            color: #f3f3f6;
            border: 2px solid rgba(255,255,255,0.1);
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
            font-weight: 500;
        }

        button.option-btn:hover, button.option-btn.selected {
            background-color: rgba(255, 42, 95, 0.3);
            border-color: var(--accent-color);
            color: #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 13px;
            color: #d1d1e0;
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
        }

        input[type="text"], input[type="date"], input[type="time"] {
            width: 100%;
            padding: 14px;
            background: rgba(22, 22, 28, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            border-radius: 14px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="date"]:focus, input[type="time"]:focus {
            border-color: var(--accent-color);
        }

        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 12px rgba(255, 42, 95, 0.4);
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .text-center {
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Слайд 1 -->
        <div class="slide active" id="slide-1">
            <h2>Я перший раз це роблю, нє судітє строго. Давай шось?</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(1, '1.погуляєм бля')">1. актівна прогулка бля</button>
                <button class="option-btn" onclick="selectOption(1, '2.чіл на лавочке')">2. чіл на лавочке</button>
                <button class="option-btn" onclick="selectOption(1, '3.можна дома, но ти не готова')">3. можна дома, но ти не готова</button>
                <button class="option-btn" onclick="selectOption(1, '4.сама обери', true)">4. сама обери</button>
            </div>
            <div class="input-group" id="input-group-1" style="display:none;">
                <label for="custom-1">піши:</label>
                <input type="text" id="custom-1" placeholder="ідею сюда...">
            </div>
            <button class="action-btn" id="next-1" style="display:none;" onclick="nextSlide(2)">опа</button>
        </div>

        <!-- Слайд 2 -->
        <div class="slide" id="slide-2">
            <h2>да-да нет-нет?</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(2, '1.кава')">1. кава</button>
                <button class="option-btn" onclick="selectOption(2, '2.піво і вінстон')">2. піво і вінстон</button>
                <button class="option-btn" onclick="selectOption(2, '3.шото тіпа я хз')">3. шото тіпа я хз</button>
            </div>
            <button class="action-btn" id="next-2" style="display:none;" onclick="nextSlide(3)">жопа</button>
        </div>

        <!-- Слайд 3 -->
        <div class="slide" id="slide-3">
            <h2>я хз?</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(3, '1.сладкое')">1. сладкое</button>
                <button class="option-btn" onclick="selectOption(3, '2.не сладкое')">2. не сладкое</button>
            </div>
            <button class="action-btn" id="next-3" style="display:none;" onclick="nextSlide(4)">хахаха</button>
        </div>

        <!-- Слайд 4 -->
        <div class="slide" id="slide-4">
            <h2>Культурна програма, єбать геміні видав КУЛЬТУРНА ПРОГРАМА, оставлю так</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(4, '1.го в театр мб')">1. го в театр мб</button>
                <button class="option-btn" onclick="selectOption(4, '2.чи кіно')">2. чи кіно</button>
                <button class="option-btn" onclick="selectOption(4, '3.сама блять вибирай', true)">3. сама блять вибирай</button>
            </div>
            <div class="input-group" id="input-group-4" style="display:none;">
                <label for="custom-4">пиши:</label>
                <input type="text" id="custom-4" placeholder="ідею сюдааааа...">
            </div>
            <button class="action-btn" id="next-4" style="display:none;" onclick="nextSlide(5)">опа</button>
        </div>

        <!-- Слайд 5 -->
        <div class="slide" id="slide-5">
            <h2>цветочкі?</h2>
            <div class="input-group">
                <label for="flowers-input">ммм?:</label>
                <input type="text" id="flowers-input" placeholder="Тут можна написати будь-що...">
            </div>
            <button class="action-btn" onclick="validateSlide5()">Дальше</button>
        </div>

        <!-- Слайд 6 -->
        <div class="slide" id="slide-6">
            <h2>Дрес-код</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(6, '1.ми нєфорюгі бандююгани')">1. ми нєфорюгі бандююгани</button>
                <button class="option-btn" onclick="selectOption(6, '2.ми офішл')">2. ми офішл</button>
                <button class="option-btn" onclick="selectOption(6, '3.тяжолий люкс')">3. тяжолий люкс</button>
            </div>
            <button class="action-btn" id="next-6" style="display:none;" onclick="nextSlide(7)">жопа</button>
        </div>

        <!-- Слайд 7 -->
        <div class="slide" id="slide-7">
            <div class="text-center">ти реально красотка</div>
            <button class="action-btn" onclick="nextSlide(8)">Далі</button>
        </div>

        <!-- Слайд 8 -->
        <div class="slide" id="slide-8">
            <h2>Коли?</h2>
            <div class="input-group">
                <div>
                    <label for="date-input">Дата:</label>
                    <input type="date" id="date-input">
                </div>
                <div style="margin-top: 10px;">
                    <label for="time-input">Час:</label>
                    <input type="time" id="time-input" value="18:00">
                </div>
            </div>
            <button class="action-btn" onclick="validateSlide8()">Далі</button>
        </div>

        <!-- Слайд 9 (Фінал) -->
        <div class="slide" id="slide-9">
            <h2>фух</h2>
            <div class="text-center" style="font-size: 15px; color: #f3f3f6; text-align: left; background: rgba(22, 22, 28, 0.85); backdrop-filter: blur(10px); padding: 16px; border-radius: 14px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.1);" id="final-summary">
            </div>
            <button class="action-btn" onclick="finishApp()">всьо єбать</button>
        </div>
    </div>

<script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let answers = {
            format: '',
            drink: '',
            food: '',
            culture: '',
            flowers: '',
            dresscode: '',
            date: '',
            time: ''
        };

        function selectOption(slideNum, value, hasCustomInput = false) {
            const buttons = document.querySelectorAll(`#slide-${slideNum} .option-btn`);
            buttons.forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');

            const customGroup = document.getElementById(`input-group-${slideNum}`);
            if (customGroup) {
                if (hasCustomInput) {
                    customGroup.style.display = 'block';
                } else {
                    customGroup.style.display = 'none';
                }
            }

            if (slideNum === 1) answers.format = value;
            if (slideNum === 2) answers.drink = value;
            if (slideNum === 3) answers.food = value;
            if (slideNum === 4) answers.culture = value;
            if (slideNum === 6) answers.dresscode = value;

            document.getElementById(`next-${slideNum}`).style.display = 'block';
        }

        function validateSlide5() {
            let val = document.getElementById('flowers-input').value.trim();
            if (!val) {
                alert('Напиши щось!');
                return;
            }
            answers.flowers = val;
            nextSlide(6);
        }

        function validateSlide8() {
            let dateVal = document.getElementById('date-input').value;
            let timeVal = document.getElementById('time-input').value;
            if (!dateVal) {
                alert('Обери дату!');
                return;
            }
            answers.date = dateVal;
            answers.time = timeVal;

            let formatFinal = answers.format.includes('4.сама обери') 
                ? (document.getElementById('custom-1').value.trim() || 'Свій варіант') 
                : answers.format;

            let cultureFinal = answers.culture.includes('3.сама блять вибирай') 
                ? (document.getElementById('custom-4').value.trim() || 'Свій варіант') 
                : answers.culture;

            document.getElementById('final-summary').innerHTML = `
                <b>раз:</b> ${formatFinal}<br>
                <b>два:</b> ${answers.drink}<br>
                <b>три:</b> ${answers.food}<br>
                <b>чотири:</b> ${cultureFinal}<br>
                <b>пять:</b> ${answers.flowers}<br>
                <b>шесть:</b> ${answers.dresscode}<br>
                <b>семки єсть?:</b> ${answers.date} о ${answers.time}
            `;

            nextSlide(9);
        }

        function nextSlide(slideNum) {
            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            document.getElementById(`slide-${slideNum}`).classList.add('active');
        }

        function finishApp() {
            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyWLprcsZ0gOqTJp7dPiJhndVoNNwpnlx4-CJEUZugPHYrMzpBx628VJwN_0vp9IcWR/exec";

            let formatFinal = answers.format.includes('4.сама обери') 
                ? (document.getElementById('custom-1').value.trim() || 'Свій варіант') 
                : answers.format;

            let cultureFinal = answers.culture.includes('3.сама блять вибирай') 
                ? (document.getElementById('custom-4').value.trim() || 'Свій варіант') 
                : answers.culture;

            let payload = {
                place: formatFinal,
                drink: answers.drink,
                food: answers.food,
                culture: cultureFinal,
                flowers: answers.flowers,
                dresscode: answers.dresscode,
                date: answers.date,
                time: answers.time
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8'
                },
                body: JSON.stringify(payload)
            }).then(response => response.json())
              .then(data => {
                alert("Усе записано! ❤️");
                tg.close();
            }).catch(error => {
                alert("Усе записано!");
                tg.close();
            });
        }
    </script>
</body>
</html>

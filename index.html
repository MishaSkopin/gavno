<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Запрошення</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #16161c;
            --text-color: #f3f3f6;
            --accent-color: #ff2a5f;
            --accent-hover: #e01f50;
            --input-bg: #22222d;
            --border-color: #2e2e3d;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--card-bg);
            padding: 24px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        .slide {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .slide.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        h2 {
            font-size: 20px;
            margin-bottom: 20px;
            line-height: 1.4;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        button.option-btn {
            background-color: var(--input-bg);
            color: var(--text-color);
            border: 2px solid transparent;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
            font-weight: 500;
        }

        button.option-btn:hover, button.option-btn.selected {
            background-color: rgba(255, 42, 95, 0.12);
            border-color: var(--accent-color);
            color: #fff;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            font-size: 13px;
            color: #8c8c9e;
            display: block;
            margin-bottom: 4px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"], input[type="date"], input[type="time"] {
            width: 100%;
            padding: 14px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            border-radius: 14px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, input[type="date"]:focus, input[type="time"]:focus {
            border-color: var(--accent-color);
        }

        .action-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .action-btn:hover {
            background-color: var(--accent-hover);
        }

        .text-center {
            text-align: center;
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 24px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Слайд 1 -->
        <div class="slide active" id="slide-1">
            <h2>Як тусимо?</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(1, '1.актівна прогулка бля')">1. актівна прогулка бля</button>
                <button class="option-btn" onclick="selectOption(1, '2.чіл на лавочке')">2. чіл на лавочке</button>
                <button class="option-btn" onclick="selectOption(1, '3.можна дома, но ти не готова')">3. можна дома, но ти не готова</button>
                <button class="option-btn" onclick="selectOption(1, '4.сама обери', true)">4. сама обери</button>
            </div>
            <div class="input-group" id="input-group-1" style="display:none;">
                <label for="custom-1">Впиши свій варіант:</label>
                <input type="text" id="custom-1" placeholder="Свою ідею сюди...">
            </div>
            <button class="action-btn" id="next-1" style="display:none;" onclick="nextSlide(2)">Далі</button>
        </div>

        <!-- Слайд 2 -->
        <div class="slide" id="slide-2">
            <h2>Чим заправляємось?</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(2, '1.кава')">1. кава</button>
                <button class="option-btn" onclick="selectOption(2, '2.піво і вінстон')">2. піво і вінстон</button>
                <button class="option-btn" onclick="selectOption(2, '3.шото тіпа я хз')">3. шото тіпа я хз</button>
            </div>
            <button class="action-btn" id="next-2" style="display:none;" onclick="nextSlide(3)">Далі</button>
        </div>

        <!-- Слайд 3 -->
        <div class="slide" id="slide-3">
            <h2>По жратві/солодкому що?</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(3, '1.сладкое')">1. сладкое</button>
                <button class="option-btn" onclick="selectOption(3, '2.не сладкое')">2. не сладкое</button>
            </div>
            <button class="action-btn" id="next-3" style="display:none;" onclick="nextSlide(4)">Далі</button>
        </div>

        <!-- Слайд 4 -->
        <div class="slide" id="slide-4">
            <h2>Культурна програма</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(4, '1.го в театр мб')">1. го в театр мб</button>
                <button class="option-btn" onclick="selectOption(4, '2.чи кіно')">2. чи кіно</button>
                <button class="option-btn" onclick="selectOption(4, '3.сама блять вибирай', true)">3. сама блять вибирай</button>
            </div>
            <div class="input-group" id="input-group-4" style="display:none;">
                <label for="custom-4">Впиши свій варіант:</label>
                <input type="text" id="custom-4" placeholder="Свою ідею сюди...">
            </div>
            <button class="action-btn" id="next-4" style="display:none;" onclick="nextSlide(5)">Далі</button>
        </div>

        <!-- Слайд 5 -->
        <div class="slide" id="slide-5">
            <h2>цветочкі?</h2>
            <div class="input-group">
                <label for="flowers-input">Твоя відповідь:</label>
                <input type="text" id="flowers-input" placeholder="Тут можна написати будь-що...">
            </div>
            <button class="action-btn" onclick="validateSlide5()">Далі</button>
        </div>

        <!-- Слайд 6 -->
        <div class="slide" id="slide-6">
            <h2>Дрес-код</h2>
            <div class="options">
                <button class="option-btn" onclick="selectOption(6, '1.ми нєфорюгі бандююгани')">1. ми нєфорюгі бандююгани</button>
                <button class="option-btn" onclick="selectOption(6, '2.ми офішл')">2. ми офішл</button>
                <button class="option-btn" onclick="selectOption(6, '3.тяжолий люкс')">3. тяжолий люкс</button>
            </div>
            <button class="action-btn" id="next-6" style="display:none;" onclick="nextSlide(7)">Далі</button>
        </div>

        <!-- Слайд 7 -->
        <div class="slide" id="slide-7">
            <div class="text-center">ти реально красотка</div>
            <button class="action-btn" onclick="nextSlide(8)">Далі</button>
        </div>

        <!-- Слайд 8 -->
        <div class="slide" id="slide-8">
            <h2>Коли бачимось?</h2>
            <div class="input-group">
                <div>
                    <label for="date-input">Дата:</label>
                    <input type="date" id="date-input">
                </div>
                <div style="margin-top: 10px;">
                    <label for="time-input">Час:</label>
                    <input type="time" id="time-input" value="18:00">
                </div>
            </div>
            <button class="action-btn" onclick="validateSlide8()">Далі</button>
        </div>

        <!-- Слайд 9 (Фінал) -->
        <div class="slide" id="slide-9">
            <h2>Все готово</h2>
            <div class="text-center" style="font-size: 15px; color: #a1a1b5; text-align: left; background: var(--input-bg); padding: 16px; border-radius: 14px; margin-bottom: 20px;" id="final-summary">
            </div>
            <button class="action-btn" onclick="finishApp()">всьо єбать</button>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let answers = {
            format: '',
            drink: '',
            food: '',
            culture: '',
            flowers: '',
            dresscode: '',
            date: '',
            time: ''
        };

        function selectOption(slideNum, value, hasCustomInput = false) {
            const buttons = document.querySelectorAll(`#slide-${slideNum} .option-btn`);
            buttons.forEach(btn => btn.classList.remove('selected'));
            event.target.classList.add('selected');

            const customGroup = document.getElementById(`input-group-${slideNum}`);
            if (customGroup) {
                if (hasCustomInput) {
                    customGroup.style.display = 'block';
                } else {
                    customGroup.style.display = 'none';
                    if (slideNum === 1) answers.format = value;
                    if (slideNum === 4) answers.culture = value;
                }
            }

            if (slideNum === 1) answers.format = value;
            if (slideNum === 2) answers.drink = value;
            if (slideNum === 3) answers.food = value;
            if (slideNum === 4) answers.culture = value;
            if (slideNum === 6) answers.dresscode = value;

            document.getElementById(`next-${slideNum}`).style.display = 'block';
        }

        function validateSlide5() {
            let val = document.getElementById('flowers-input').value.trim();
            if (!val) {
                alert('Напиши щось про квіточки!');
                return;
            }
            answers.flowers = val;
            nextSlide(6);
        }

        function validateSlide8() {
            let dateVal = document.getElementById('date-input').value;
            let timeVal = document.getElementById('time-input').value;
            if (!dateVal) {
                alert('Обери дату!');
                return;
            }
            answers.date = dateVal;
            answers.time = timeVal;

            // Формуємо фінальний текст
            document.getElementById('final-summary').innerHTML = `
                <b>Формат:</b> ${answers.format === '4.сама обери' ? document.getElementById('custom-1').value || 'Свій варіант' : answers.format}<br>
                <b>Напій:</b> ${answers.drink}<br>
                <b>Їжа:</b> ${answers.food}<br>
                <b>Культура:</b> ${answers.culture === '3.сама блять вибирай' ? document.getElementById('custom-4').value || 'Свій варіант' : answers.culture}<br>
                <b>Цвіточки:</b> ${answers.flowers}<br>
                <b>Дрес-код:</b> ${answers.dresscode}<br>
                <b>Коли:</b> ${answers.date} о ${answers.time}
            `;

            nextSlide(9);
        }

        function nextSlide(slideNum) {
            // Перевіряємо кастомний ввід якщо натиснули далі на слайді 1 або 4
            if (slideNum === 2 && answers.format.includes('сама обери')) {
                let customVal = document.getElementById('custom-1').value.trim();
                if (customVal) answers.format = `сама обери: ${customVal}`;
            }
            if (slideNum === 5 && answers.culture.includes('сама блять вибирай')) {
                let customVal = document.getElementById('custom-4').value.trim();
                if (customVal) answers.culture = `сама блять вибирай: ${customVal}`;
            }

            document.querySelectorAll('.slide').forEach(s => s.classList.remove('active'));
            document.getElementById(`slide-${slideNum}`).classList.add('active');
        }

        function finishApp() {
            const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyWLprcsZ0gOqTJp7dPiJhndVoNNwpnlx4-CJEUZugPHYrMzpBx628VJwN_0vp9IcWR/exec";

            let payload = {
                place: answers.format,
                drink: answers.drink,
                food: answers.food,
                culture: answers.culture,
                flowers: answers.flowers,
                dresscode: answers.dresscode,
                date: answers.date,
                time: answers.time
            };

            fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            }).then(() => {
                alert("Усе записано! ❤️");
                tg.close();
            }).catch(error => {
                alert("Сталася помилка, але все ок.");
                tg.close();
            });
        }
    </script>
</body>
</html>
